<mat-toolbar color="primary">
  <mat-icon class="burger-icon" (click)="drawer.toggle()">menu</mat-icon>
  <span class="spacer"></span>
  <span>My Cool App</span>
  <button mat-button>About</button>
  <button mat-button>Contact</button>
  <button mat-raised-button>Salir</button>
</mat-toolbar>
<mat-drawer-container hasBackdrop="false">
  <mat-drawer #drawer opened="true" position="start" mode="side">
    <mat-list>
      <mat-list-item
        ><button mat-button routerLink="/home">
          <mat-icon>home</mat-icon> Home
        </button></mat-list-item
      >
      <mat-list-item
        ><button mat-button routerLink="/orders">
          <mat-icon>description</mat-icon> Orders
        </button></mat-list-item
      >
    </mat-list>
  </mat-drawer>
  <mat-drawer-content>
    <router-outlet></router-outlet>
  </mat-drawer-content>
</mat-drawer-container>
