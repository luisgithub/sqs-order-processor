<div class="order-container">
  <h2>Create New Order</h2>

  <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="status">Order Status</label>
      <select id="status" formControlName="status">
        <option value="PENDING">Pending</option>
        <option value="PROCESSING">Processing</option>
      </select>
    </div>

    <div>
      <label for="amount">Amount</label>
      <input id="amount" type="number" step="0.01" formControlName="amount" />
      @if (orderForm.get('amount')?.touched && orderForm.get('amount')?.invalid) {
        <small style="color: red">Amount must be greater than 0.</small>
      }
    </div>

    <button type="submit" [disabled]="orderForm.invalid">Submit Order</button>
  </form>

  <!-- Angular 21 Control Flow to handle the Signal response -->
  @if (savedOrder(); as order) {
    <div class="success-banner" style="margin-top: 20px; padding: 15px; border: 1px solid green">
      <h3>Order Saved Successfully!</h3>
      <p><strong>Generated ID:</strong> {{ order.id }}</p>
      <p><strong>Status:</strong> {{ order.status }}</p>
      <p><strong>Amount:</strong> {{ order.amount | currency }}</p>
    </div>
  }
</div>
