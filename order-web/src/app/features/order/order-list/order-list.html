<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Orders</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (loading()) {
        <p>Loading orders...</p>
      }

      @if (error(); as msg) {
        <p style="color: red">{{ msg }}</p>
        <button mat-raised-button color="warn" (click)="loadOrders()">Retry</button>
      }

      @if (!loading() && !error()) {
        <table mat-table [dataSource]="orders()">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let order">{{ order.id }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let order">{{ order.status }}</td>
          </ng-container>

          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Amount</th>
            <td mat-cell *matCellDef="let order">{{ order.amount | currency }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let order">
              <button mat-icon-button color="warn" (click)="confirmDelete(order.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        @if (orders().length === 0) {
          <p>No orders found.</p>
        }
      }
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-raised-button color="primary" routerLink="/orders/create">Create Order</button>
    </mat-card-actions>
  </mat-card>
</div>
