include classpath("application.conf")

queues {
  # Standard Queue (No dots, no quotes needed)
  order-processing-queue {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
  }
  
  # FIX: FIFO Queue name MUST be explicitly quoted because it contains a dot
  "payment-transactions.fifo" {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    
    # Use standard boolean flags now that the name is safely quoted
    fifo = true
    contentBasedDeduplication = true
  }
}